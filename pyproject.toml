[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-sys-memory-monitor"
version = "0.1.0"
description = "Standalone sampled process-tree memory monitor for long-running commands"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
memory-monitor = "memory_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
